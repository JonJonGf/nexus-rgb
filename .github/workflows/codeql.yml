name: Analisar segurança (CodeQL)
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 10 * * 1'
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true
jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            os: ubuntu-latest
            build-mode: none
          - language: javascript-typescript
            os: ubuntu-latest
            build-mode: none
          - language: csharp
            os: windows-latest
            build-mode: manual
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Inicializar análise estendida, incluindo fontes locais
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended
          config: |
            threat-models: [local]
      - name: Compilar supervisor, auxiliares e diagnóstico sem abrir hardware
        if: matrix.language == 'csharp'
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          ./scripts/build-native.ps1 -OutputDirectory "$env:RUNNER_TEMP\nexus-codeql-native"
          if($LASTEXITCODE -ne 0){throw 'Native build failed'}
          ./scripts/build-cooling.ps1 -OutputDirectory "$env:RUNNER_TEMP\nexus-codeql-cooling"
          if($LASTEXITCODE -ne 0){throw 'Cooling build failed'}
          ./scripts/build-diagnostic.ps1 -OutputDirectory "$env:RUNNER_TEMP\nexus-codeql-diagnostic"
          if($LASTEXITCODE -ne 0){throw 'Diagnostic build failed'}
      - name: Publicar resultados
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          category: /language:${{ matrix.language }}
          output: codeql-results
      - name: Guardar evidências da análise
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codeql-sarif-${{ matrix.language }}
          path: codeql-results/*.sarif
          retention-days: 7
          if-no-files-found: error
